<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JOY VIP HACK - Full Official Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rubik', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05070f;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
        }

        /* ফ্লোটিং আইকন (কাস্টম ইমেজ লিংক সহ) */
        #floating-icon-btn {
            position: fixed;
            top: 40px;
            right: 20px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
            cursor: move;
            z-index: 9999;
            overflow: hidden;
            touch-action: none;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #floating-icon-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }

        /* পাসওয়ার্ড পপআপ উইন্ডো */
        #auth-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 260px;
            background: rgba(10, 15, 30, 0.98);
            border: 2px solid #ffd700;
            border-radius: 14px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
            padding: 15px;
            display: none;
            z-index: 10000;
            text-align: center;
        }

        .auth-title {
            font-size: 11px;
            font-weight: 900;
            color: #ffd700;
            margin-bottom: 8px;
        }

        .auth-input {
            width: 100%;
            padding: 6px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #ffd700;
            border-radius: 6px;
            color: #fff;
            font-size: 10px;
            text-align: center;
            margin-bottom: 8px;
            outline: none;
            font-weight: 600;
        }

        .remember-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 8.5px;
            color: #cbd5e1;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .auth-btn {
            width: 100%;
            padding: 6px;
            background: linear-gradient(135deg, #ffd700, #b8860b);
            border: none;
            border-radius: 6px;
            color: #000;
            font-size: 9px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
        }

        #error-msg {
            color: #ff3366;
            font-size: 8px;
            margin-top: 4px;
            display: none;
            font-weight: 700;
        }

        /* হুবহু স্ক্রিনশটের মতো গোল্ডেন গ্লোয়িং পপআপ বক্স */
        .overlay-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 285px;
            background: #000000;
            border: 2px solid #ffd700;
            border-radius: 15px;
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.7);
            padding: 9px;
            display: none;
            z-index: 9999;
            touch-action: none;
            text-align: center;
        }

        .close-btn {
            position: absolute;
            top: 6px;
            right: 9px;
            background: transparent;
            color: #ffd700;
            border: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            z-index: 25;
        }

        /* ওনার টাইটেল */
        .owner-title {
            font-size: 9.5px;
            font-weight: 900;
            color: #ffd700;
            letter-spacing: 0.6px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        /* একদম ওপরের স্ট্যাটাস বার (LIVE, MOD, PING) */
        .top-status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(20, 20, 20, 0.9);
            border: 1px solid rgba(255, 215, 0, 0.4);
            border-radius: 6px;
            padding: 4px 8px;
            margin-bottom: 8px;
            font-size: 8px;
            font-weight: bold;
        }

        .status-live {
            color: #4caf50;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .live-dot {
            width: 4px;
            height: 4px;
            background-color: #4caf50;
            border-radius: 50%;
            box-shadow: 0 0 5px #4caf50;
        }

        .status-mod {
            color: #fff;
        }
        .mod-on {
            color: #4caf50;
        }

        .status-ping {
            color: #fff;
        }
        .ping-value {
            color: #00bcd4;
        }

        /* ক্রিস্টাল বল এবং নাম্বার */
        .crystal-ball-container {
            position: relative;
            margin: 6px auto;
            width: 48px;
            height: 48px;
            background: radial-gradient(circle, rgba(255,0,0,1) 0%, rgba(255,165,0,1) 15%, rgba(255,255,0,1) 30%, rgba(0,128,0,1) 45%, rgba(0,0,255,1) 60%, rgba(75,0,130,1) 75%, rgba(238,130,238,1) 90%);
            border-radius: 50%;
            box-shadow: 0 0 14px rgba(255, 255, 255, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .one-text {
            font-size: 26px;
            font-weight: 900;
            color: #fff;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.8);
        }

        /* স্মল/বিগ টেক্সট */
        .prediction-text {
            font-size: 17px;
            font-weight: 900;
            color: #ffd700;
            letter-spacing: 1.5px;
            margin-bottom: 2px;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.7);
        }

        /* পিরিয়ড টেক্সট */
        .period-text {
            font-size: 8.5px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
            letter-spacing: 0.4px;
        }

        /* বাটন গ্রুপ (AGAIN, HIDE) */
        .button-group {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            gap: 6px;
        }

        .btn {
            background-color: transparent;
            border: 1px solid #ffd700;
            color: #ffd700;
            border-radius: 15px;
            padding: 5px 0;
            font-size: 8.5px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            width: 48%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            box-shadow: 0 0 6px rgba(255, 215, 0, 0.3);
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: rgba(255, 215, 0, 0.1);
        }

        /* জয়েন নাউ বাটন */
        .join-btn {
            background: linear-gradient(135deg, #ffd700, #b8860b);
            border: none;
            color: #000;
            width: 100%;
            padding: 8px 0;
            border-radius: 18px;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            text-decoration: none;
        }

        .join-btn:hover {
            box-shadow: 0 0 16px rgba(255, 215, 0, 0.9);
        }
    </style>
</head>
<body>

    <!-- কাস্টম রেফারেল গেম লিংক iframe -->
    <iframe id="game-iframe" src="https://hgnice.bet/#/register?invitationCode=376851951983" loading="lazy"></iframe>

    <!-- ফ্লোটিং আইকন (কাস্টম ইমেজ লিংক) -->
    <div id="floating-icon-btn" onclick="handleIconClick()">
        <img src="https://imagepaste.org/i/cbp8qk93.png" alt="Joy Icon">
    </div>

    <!-- পাসওয়ার্ড পপআপ উইন্ডো -->
    <div id="auth-overlay">
        <div class="auth-title">🔐 JOY VIP ACCESS</div>
        <input type="password" id="pass-input" class="auth-input" placeholder="Enter Password">
        <label class="remember-row">
            <input type="checkbox" id="remember-pass"> Remember Password
        </label>
        <button class="auth-btn" onclick="checkPassword()">Submit</button>
        <div id="error-msg">Wrong Password!</div>
    </div>

    <!-- মূল হ্যাক পপআপ উইন্ডো (হুবহু স্ক্রিনশট ডিজাইন) -->
    <div class="overlay-box" id="main-content">
        <button class="close-btn" onclick="hidePopup()">×</button>

        <!-- কাস্টম নাম -->
        <div class="owner-title">♚𝗢𝗪𝗡𝗘𝗥 𝗢𝗙 𝗝𝗢𝗬【𝟐𝐱™️】</div>

        <!-- স্ট্যাটাস বার -->
        <div class="top-status-bar">
            <div class="status-live">
                <div class="live-dot"></div>
                LIVE
            </div>
            <div class="status-mod">
                MOD: <span class="mod-on">ON</span>
            </div>
            <div class="status-ping">
                PING: <span class="ping-value">12MS</span>
            </div>
        </div>

        <!-- ক্রিস্টাল বল এবং নাম্বার -->
        <div class="crystal-ball-container">
            <div class="one-text" id="ball-num">1</div>
        </div>

        <!-- প্রেডিকশন এবং পিরিয়ড -->
        <div class="prediction-text" id="res-size">SMALL</div>
        <div class="period-text" id="period">PERIOD: 2026110930542</div>

        <!-- বাটন গ্রুপ (AGAIN, HIDE) -->
        <div class="button-group">
            <button class="btn" onclick="refreshPrediction()">
                <span>↻</span> AGAIN
            </button>
            <button class="btn" onclick="hidePopup()">
                <span>👁</span> HIDE
            </button>
        </div>

        <!-- জয়েন নাউ বাটন (টেলিগ্রাম আইডি @BDT588 লিংকযুক্ত) -->
        <a href="https://t.me/BDT588" target="_blank" class="join-btn">
            <span>» ⚡</span> JOIN NOW <span>«</span>
        </a>
    </div>

    <script>
        let isUnlocked = localStorage.getItem("joy_hack_unlocked") === "true";
        const totalDuration = 30; // প্রতি ৩০ সেকেন্ড পর পর পিরিয়ড আপডেট হবে

        function handleIconClick() {
            if (isUnlocked) {
                document.getElementById('main-content').style.display = 'block';
                document.getElementById('floating-icon-btn').style.display = 'none';
                startPeriodGenerator();
            } else {
                document.getElementById('auth-overlay').style.display = 'block';
            }
        }

        function checkPassword() {
            const pass = document.getElementById('pass-input').value;
            const rememberMe = document.getElementById('remember-pass').checked;

            if (pass === "Zahirul22369") {
                isUnlocked = true;
                if (rememberMe) {
                    localStorage.setItem("joy_hack_unlocked", "true");
                }
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                document.getElementById('floating-icon-btn').style.display = 'none';
                startPeriodGenerator();
            } else {
                document.getElementById('error-msg').style.display = 'block';
                document.getElementById('pass-input').value = "";
            }
        }

        function hidePopup() {
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('floating-icon-btn').style.display = 'flex';
        }

        function refreshPrediction() {
            updatePeriodAndSignal();
        }

        function startPeriodGenerator() {
            function updatePeriodAndSignal() {
                if (!isUnlocked) return;

                const now = new Date();
                const totalSecs = now.getUTCHours() * 3600 + now.getUTCMinutes() * 60 + now.getUTCSeconds();
                let periodIndex = Math.floor(totalSecs / totalDuration) + 500; // বড় পিরিয়ড নাম্বার রেঞ্জ রাখার জন্য
                let dateStr = `${now.getUTCFullYear()}${String(now.getUTCMonth() + 1).padStart(2, '0')}${String(now.getUTCDate()).padStart(2, '0')}`;
                
                let fullPeriodNumber = `${dateStr}30${periodIndex}`;
                
                document.getElementById('period').innerText = `PERIOD: ${fullPeriodNumber}`;

                let seed = periodIndex;
                let isBig = (seed % 2 === 0);

                document.getElementById('res-size').innerText = isBig ? "BIG" : "SMALL";
                let luckyNum = isBig ? (5 + (seed % 5)) : (seed % 5);
                document.getElementById('ball-num').innerText = luckyNum;
            }

            updatePeriodAndSignal();
            setInterval(updatePeriodAndSignal, 1000);
        }

        // ড্র্যাগএবল ফিচার (আইকন এবং পপআপ দুটোই যেকোনো জায়গায় টানাটানি করা যাবে)
        makeDraggable(document.getElementById("floating-icon-btn"));
        makeDraggable(document.getElementById("main-content"));

        function makeDraggable(elmnt) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            elmnt.onmousedown = dragMouseDown;
            elmnt.ontouchstart = dragMouseDown;

            function dragMouseDown(e) {
                e = e || window.event;
                let clientX = e.type === "touchstart" ? e.touches[0].clientX : e.clientX;
                let clientY = e.type === "touchstart" ? e.touches[0].clientY : e.clientY;
                pos3 = clientX;
                pos4 = clientY;
                document.onmouseup = closeDragElement;
                document.ontouchend = closeDragElement;
                document.onmousemove = elementDrag;
                document.ontouchmove = elementDrag;
            }

            function elementDrag(e) {
                e = e || window.event;
                let clientX = e.type === "touchmove" ? e.touches[0].clientX : e.clientX;
                let clientY = e.type === "touchmove" ? e.touches[0].clientY : e.clientY;
                pos1 = pos3 - clientX;
                pos2 = pos4 - clientY;
                pos3 = clientX;
                pos4 = clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
                elmnt.style.transform = "none";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.ontouchend = null;
                document.onmousemove = null;
                document.ontouchmove = null;
            }
        }
    </script>
</body>
</html>
