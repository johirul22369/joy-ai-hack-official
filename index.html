<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JoyTG VIP Hack - Lion Popup Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rubik', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #03050b;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
        }

        /* ফ্লোটিং আইকন */
        #floating-icon-btn {
            position: fixed;
            top: 40px;
            right: 20px;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 2px solid #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.9);
            cursor: move;
            z-index: 9999;
            overflow: hidden;
            touch-action: none;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #floating-icon-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }

        /* পাসওয়ার্ড পপআপ উইন্ডো */
        #auth-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 260px;
            background: rgba(8, 12, 24, 0.98);
            border: 2px solid #ffd700;
            border-radius: 14px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.7);
            padding: 15px;
            display: none;
            z-index: 10000;
            text-align: center;
        }

        .auth-title {
            font-size: 11px;
            font-weight: 900;
            color: #ffd700;
            margin-bottom: 8px;
        }

        .auth-input {
            width: 100%;
            padding: 7px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #ffd700;
            border-radius: 6px;
            color: #fff;
            font-size: 10px;
            text-align: center;
            margin-bottom: 8px;
            outline: none;
            font-weight: 700;
        }

        .remember-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 8.5px;
            color: #cbd5e1;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .auth-btn {
            width: 100%;
            padding: 7px;
            background: linear-gradient(135deg, #ffd700, #b8860b);
            border: none;
            border-radius: 6px;
            color: #000;
            font-size: 9.5px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
        }

        #error-msg {
            color: #ff3366;
            font-size: 8px;
            margin-top: 4px;
            display: none;
            font-weight: 700;
        }

        /* মূল পপআপ উইন্ডো (ইমেজ ব্যাকগ্রাউন্ড) */
        .overlay-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 310px;
            display: none;
            z-index: 9999;
            touch-action: none;
            text-align: center;
        }

        .popup-relative-wrapper {
            position: relative;
            width: 100%;
        }

        .popup-main-bg-img {
            width: 100%;
            display: block;
            filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.6));
            pointer-events: none;
        }

        .close-btn {
            position: absolute;
            top: 4px;
            right: 14px;
            background: #ef4444;
            color: white;
            border: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            z-index: 25;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 8px #ef4444;
        }

        /* ব্র্যান্ডের নাম (JoyTG) - একদম ওপরের ব্যানারে সেন্টারে */
        .brand-header-title {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10.5px;
            font-weight: 900;
            color: #ffd700;
            white-space: nowrap;
            text-shadow: 0 0 6px rgba(0, 0, 0, 0.9), 0 0 4px #ffd700;
            z-index: 10;
        }

        /* 🎯 ডানপাশের গোল্ডেন খালি বক্সের একদম মাঝখানে পজিশন করা প্রেডিকশন এরিয়া */
        .center-prediction-area {
            position: absolute;
            top: 75px;
            right: 18px;
            width: 125px;
            height: 75px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        /* পিরিয়ড নাম্বার (সঠিক রানিং অ্যাক্টিভ পিরিয়ড) */
        .period-display {
            font-size: 7.5px;
            font-weight: 900;
            color: #38bdf8;
            letter-spacing: 0.4px;
            text-shadow: 0 0 4px rgba(0, 0, 0, 0.9);
            margin-bottom: 2px;
        }

        /* এক রঙের সোজা ও মোটা BIG / SMALL টেক্সট */
        .solid-big-small {
            font-size: 20px;
            font-weight: 900;
            color: #ffd700;
            letter-spacing: 1.5px;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.9), 0 0 5px rgba(255, 215, 0, 0.8);
            line-height: 1;
            margin-bottom: 4px;
        }

        /* অফিশিয়াল গেম ব্যাজ (একটিমাত্র সিঙ্গেল নাম্বার) */
        .official-num-badge {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 1px 1px 2px #000;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.8);
        }

        /* অফিশিয়াল কালার রুল */
        .bg-red { background: linear-gradient(135deg, #ef4444, #991b1b); border: 1.5px solid #fca5a5; }
        .bg-green { background: linear-gradient(135deg, #22c55e, #15803d); border: 1.5px solid #86efac; }
        .bg-violet { background: linear-gradient(135deg, #a855f7, #6b21a8); border: 1.5px solid #d8b4fe; }

        /* নিচের বাটন ও টেলিগ্রাম লিংক */
        .bottom-action-bar {
            margin-top: 6px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 0 8px;
        }

        .button-row {
            display: flex;
            gap: 6px;
        }

        .action-btn {
            flex: 1;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #ffd700;
            color: #ffd700;
            border-radius: 12px;
            padding: 5px 0;
            font-size: 8.5px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(255, 215, 0, 0.3);
        }

        .telegram-join-btn {
            background: linear-gradient(135deg, #ffd700, #b8860b);
            color: #000;
            border-radius: 14px;
            padding: 7px 0;
            font-size: 9.5px;
            font-weight: 900;
            text-decoration: none;
            letter-spacing: 0.8px;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
    </style>
</head>
<body>

    <!-- রেফারেল গেম লিংক iframe -->
    <iframe id="game-iframe" src="https://hgnice.bet/#/register?invitationCode=376851951983" loading="lazy"></iframe>

    <!-- ফ্লোটিং আইকন -->
    <div id="floating-icon-btn" onclick="handleIconClick()">
        <img src="https://imagepaste.org/i/cbp8qk93.png" alt="Joy Icon">
    </div>

    <!-- পাসওয়ার্ড পপআপ -->
    <div id="auth-overlay">
        <div class="auth-title">🔐 JoyTG VIP ACCESS</div>
        <input type="password" id="pass-input" class="auth-input" placeholder="Enter Password">
        <label class="remember-row">
            <input type="checkbox" id="remember-pass"> Remember Password
        </label>
        <button class="auth-btn" onclick="checkPassword()">Submit</button>
        <div id="error-msg">Wrong Password!</div>
    </div>

    <!-- মূল পপআপ উইন্ডো (সিংহ থিম ব্যাকগ্রাউন্ড ইমেজ সহ) -->
    <div class="overlay-box" id="main-content">
        <div class="popup-relative-wrapper">
            <button class="close-btn" onclick="hidePopup()">×</button>

            <!-- ব্র্যান্ড নেম (JoyTG) -->
            <div class="brand-header-title">👑 OWNER OF JoyTG 【2x™】</div>

            <!-- তোর সেই রিমুভড লায়ন পপআপ ইমেজ -->
            <img src="https://instasize.com/api/image/d38a5aa1b7953099a0fef69d3da5b894c7338dfff0bc83cc7b1c32db0cead6fe.png" alt="JoyTG VIP Popup" class="popup-main-bg-img">

            <!-- গোল্ডেন বক্সের ভেতরে নিখুঁতভাবে বসানো প্রেডিকশন ও সিঙ্গেল নাম্বার -->
            <div class="center-prediction-area">
                <div class="period-display" id="period-num">P 2026111130542</div>
                <div class="solid-big-small" id="res-size">WAITING...</div>
                <div class="official-num-badge bg-green" id="official-num" style="display: none;">7</div>
            </div>
        </div>

        <div class="bottom-action-bar">
            <div class="button-row">
                <button class="action-btn" onclick="refreshPrediction()">↻ REFRESH</button>
                <button class="action-btn" onclick="hidePopup()">👁 HIDE</button>
            </div>
            <a href="https://t.me/BDT588" target="_blank" class="telegram-join-btn">
                ⚡ JOIN ADMIN (@BDT588) ⚡
            </a>
        </div>
    </div>

    <script>
        let isUnlocked = localStorage.getItem("joy_hack_unlocked") === "true";
        const totalDuration = 30;

        function handleIconClick() {
            if (isUnlocked) {
                document.getElementById('main-content').style.display = 'block';
                document.getElementById('floating-icon-btn').style.display = 'none';
                startPeriodGenerator();
            } else {
                document.getElementById('auth-overlay').style.display = 'block';
            }
        }

        function checkPassword() {
            const pass = document.getElementById('pass-input').value;
            const rememberMe = document.getElementById('remember-pass').checked;

            if (pass === "Zahirul22369") {
                isUnlocked = true;
                if (rememberMe) {
                    localStorage.setItem("joy_hack_unlocked", "true");
                }
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                document.getElementById('floating-icon-btn').style.display = 'none';
                startPeriodGenerator();
            } else {
                document.getElementById('error-msg').style.display = 'block';
                document.getElementById('pass-input').value = "";
            }
        }

        function hidePopup() {
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('floating-icon-btn').style.display = 'flex';
        }

        function refreshPrediction() {
            updateSignalLogic();
        }

        function startPeriodGenerator() {
            updateSignalLogic();
            setInterval(updateSignalLogic, 1000);
        }

        function updateSignalLogic() {
            if (!isUnlocked) return;

            const now = new Date();
            const totalSecs = now.getUTCHours() * 3600 + now.getUTCMinutes() * 60 + now.getUTCSeconds();
            
            // রানিং অ্যাক্টিভ পিরিয়ড সঠিক দেখানোর জন্য ১ ঘর পেছনে সেট করা
            let periodIndex = Math.floor(totalSecs / totalDuration) + 500 - 1;
            let dateStr = `${now.getUTCFullYear()}${String(now.getUTCMonth() + 1).padStart(2, '0')}${String(now.getUTCDate()).padStart(2, '0')}`;
            
            let fullPeriod = `${dateStr}30${periodIndex}`;
            let timeLeft = totalDuration - (totalSecs % totalDuration);

            document.getElementById('period-num').innerText = `P ${fullPeriod}`;

            let sizeEl = document.getElementById('res-size');
            let numEl = document.getElementById('official-num');

            if (timeLeft >= 28) {
                sizeEl.innerText = "WAITING...";
                sizeEl.style.fontSize = "12px";
                numEl.style.display = "none";
            } else {
                sizeEl.style.fontSize = "20px";
                
                let seed = periodIndex * 13;
                let isBig = (seed % 100) > 42; 

                sizeEl.innerText = isBig ? "BIG" : "SMALL";

                let luckyNum;
                if (isBig) {
                    luckyNum = 5 + (seed % 5);
                } else {
                    luckyNum = seed % 5;
                }

                numEl.innerText = luckyNum;
                numEl.className = "official-num-badge";

                if (luckyNum === 0 || luckyNum === 5) {
                    numEl.classList.add("bg-violet");
                } else if (luckyNum === 1 || luckyNum === 3 || luckyNum === 7 || luckyNum === 9) {
                    numEl.classList.add("bg-green");
                } else {
                    numEl.classList.add("bg-red");
                }

                numEl.style.display = "flex";
            }
        }

        makeDraggable(document.getElementById("floating-icon-btn"));
        makeDraggable(document.getElementById("main-content"));

        function makeDraggable(elmnt) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            elmnt.onmousedown = dragMouseDown;
            elmnt.ontouchstart = dragMouseDown;

            function dragMouseDown(e) {
                e = e || window.event;
                let clientX = e.type === "touchstart" ? e.touches[0].clientX : e.clientX;
                let clientY = e.type === "touchstart" ? e.touches[0].clientY : e.clientY;
                pos3 = clientX;
                pos4 = clientY;
                document.onmouseup = closeDragElement;
                document.ontouchend = closeDragElement;
                document.onmousemove = elementDrag;
                document.ontouchmove = elementDrag;
            }

            function elementDrag(e) {
                e = e || window.event;
                let clientX = e.type === "touchmove" ? e.touches[0].clientX : e.clientX;
                let clientY = e.type === "touchmove" ? e.touches[0].clientY : e.clientY;
                pos1 = pos3 - clientX;
                pos2 = pos4 - clientY;
                pos3 = clientX;
                pos4 = clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
                elmnt.style.transform = "none";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.ontouchend = null;
                document.onmousemove = null;
                document.ontouchmove = null;
            }
        }
    </script>
</body>
</html>
